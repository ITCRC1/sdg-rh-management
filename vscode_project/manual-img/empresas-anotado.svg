<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 780" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="780" fill="#F5F1E6"/>

  <rect x="16" y="16" width="180" height="38" rx="19" fill="#3f4a2b"/>
  <text x="106" y="40" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">+ Agregar empresa</text>
  <circle cx="26" cy="10" r="10" fill="#1f2d3d"/><text x="26" y="14" font-size="10" text-anchor="middle" fill="#fff">1</text>

  <rect x="16" y="64" width="668" height="60" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="86" font-size="12" font-weight="bold">SDG RH MANAGEMENT S.R.L</text>
  <text x="32" y="102" font-size="9.5" fill="#777">Dotación de RRHH · Blake Adam Delatte · SCP Corcovado Wilderness Lodge</text>
  <rect x="470" y="80" width="50" height="24" rx="12" fill="#3f4a2b"/><text x="495" y="96" font-size="9" text-anchor="middle" fill="#fff">Usar</text>
  <rect x="528" y="80" width="55" height="24" rx="12" fill="#fff" stroke="#3f4a2b"/><text x="555" y="96" font-size="9" text-anchor="middle">Editar</text>
  <rect x="590" y="80" width="65" height="24" rx="12" fill="#fff" stroke="#B3261E"/><text x="622" y="96" font-size="9" text-anchor="middle" fill="#B3261E">Eliminar</text>
  <circle cx="495" cy="74" r="9" fill="#1f2d3d"/><text x="495" y="78" font-size="9" text-anchor="middle" fill="#fff">2</text>
  <circle cx="555" cy="74" r="9" fill="#1f2d3d"/><text x="555" y="78" font-size="9" text-anchor="middle" fill="#fff">3</text>
  <circle cx="622" cy="74" r="9" fill="#1f2d3d"/><text x="622" y="78" font-size="9" text-anchor="middle" fill="#fff">4</text>

  <!-- Editar empresa form -->
  <rect x="16" y="140" width="668" height="620" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="164" font-size="13" font-weight="bold">Editar empresa</text>

  <g font-size="10">
    <text x="32" y="190" fill="#888">NOMBRE DE LA EMPRESA</text>
    <rect x="32" y="196" width="620" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <circle cx="662" cy="186" r="9" fill="#1f2d3d"/><text x="662" y="190" font-size="9" text-anchor="middle" fill="#fff">5</text>

    <text x="32" y="240" fill="#888">DIRECCIÓN DE OFICINAS CENTRALES (provincia · cantón · distrito · señas)</text>
    <rect x="32" y="246" width="620" height="60" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <circle cx="662" cy="236" r="9" fill="#1f2d3d"/><text x="662" y="240" font-size="9" text-anchor="middle" fill="#fff">6</text>

    <text x="32" y="326" fill="#888">ACTIVIDAD DE LA EMPRESA</text>
    <rect x="32" y="332" width="620" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <circle cx="662" cy="322" r="9" fill="#1f2d3d"/><text x="662" y="326" font-size="9" text-anchor="middle" fill="#fff">7</text>

    <text x="32" y="376" fill="#888">PROPIEDADES EN EL PORTAFOLIO DE LA EMPRESA</text>
    <rect x="32" y="382" width="16" height="16" fill="#fff" stroke="#3f4a2b"/>
    <text x="54" y="394" font-size="9.5">SCP CORCOVADO WILDERNESS LODGE (Drake, Osa, Puntarenas)</text>
    <circle cx="662" cy="372" r="9" fill="#1f2d3d"/><text x="662" y="376" font-size="9" text-anchor="middle" fill="#fff">8</text>

    <text x="32" y="424" fill="#888">TIPO DE CÉDULA / NÚMERO DE CÉDULA</text>
    <rect x="32" y="430" width="300" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <rect x="342" y="430" width="310" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <circle cx="662" cy="420" r="9" fill="#1f2d3d"/><text x="662" y="424" font-size="9" text-anchor="middle" fill="#fff">9</text>

    <text x="32" y="474" fill="#888">REPRESENTANTE LEGAL (nombre, nacionalidad, identificación, dirección, puesto)</text>
    <rect x="32" y="480" width="620" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <rect x="32" y="512" width="300" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <rect x="342" y="512" width="310" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <rect x="32" y="544" width="620" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <rect x="32" y="576" width="620" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/>
    <text x="32" y="614" font-size="8.5" fill="#a8781f">Se sobrescribe automáticamente al usar esta empresa en un contrato — estos campos son solo de referencia</text>
    <circle cx="662" cy="470" r="9" fill="#1f2d3d"/><text x="662" y="474" font-size="9" text-anchor="middle" fill="#fff">10</text>
  </g>

  <rect x="32" y="640" width="90" height="34" rx="17" fill="#3f4a2b"/><text x="77" y="662" font-size="10" text-anchor="middle" fill="#fff">💾 Guardar</text>
  <rect x="130" y="640" width="90" height="34" rx="17" fill="#fff" stroke="#999"/><text x="175" y="662" font-size="10" text-anchor="middle">Cancelar</text>
  <circle cx="77" cy="634" r="9" fill="#1f2d3d"/><text x="77" y="638" font-size="9" text-anchor="middle" fill="#fff">11</text>
</svg>
