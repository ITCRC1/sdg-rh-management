<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="700" fill="#F5F1E6"/>

  <!-- Botones superiores -->
  <rect x="16" y="30" width="150" height="36" rx="6" fill="#fff" stroke="#3f4a2b"/>
  <text x="91" y="53" font-size="11" text-anchor="middle">💾 Guardar como…</text>
  <circle cx="26" cy="24" r="11" fill="#1f2d3d"/><text x="26" y="28" font-size="11" text-anchor="middle" fill="#fff">1</text>

  <rect x="176" y="30" width="150" height="36" rx="6" fill="#C9A227"/>
  <text x="251" y="53" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">⬇ Descargar PDF</text>
  <circle cx="186" cy="24" r="11" fill="#1f2d3d"/><text x="186" y="28" font-size="11" text-anchor="middle" fill="#fff">2</text>

  <!-- 3 avisos -->
  <rect x="16" y="80" width="768" height="50" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="99" font-size="11" font-weight="bold">Sin empresa aplicada</text>
  <text x="32" y="115" font-size="9.5" fill="#777">Elige o crea una empresa en Empresas — sus datos se completan solos aquí.</text>
  <circle cx="26" cy="88" r="10" fill="#1f2d3d"/><text x="26" y="92" font-size="10" text-anchor="middle" fill="#fff">3</text>

  <rect x="16" y="136" width="768" height="50" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="155" font-size="11" font-weight="bold">Sin puesto aplicado</text>
  <text x="32" y="171" font-size="9.5" fill="#777">Elige o crea un puesto en Puestos — jefatura, jornada y tareas se completan solos.</text>
  <circle cx="26" cy="144" r="10" fill="#1f2d3d"/><text x="26" y="148" font-size="10" text-anchor="middle" fill="#fff">4</text>

  <rect x="16" y="192" width="768" height="50" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="211" font-size="11" font-weight="bold">Lugar de firma: automático</text>
  <text x="32" y="227" font-size="9.5" fill="#777">Se completa solo con la ubicación de la propiedad aplicada.</text>
  <circle cx="26" cy="200" r="10" fill="#1f2d3d"/><text x="26" y="204" font-size="10" text-anchor="middle" fill="#fff">5</text>

  <!-- Secciones acordeón -->
  <g font-size="12" font-weight="bold" fill="#2b2b2b">
    <rect x="16" y="256" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="283">Idioma del contrato</text>
    <circle cx="775" cy="256" r="11" fill="#1f2d3d"/><text x="775" y="260" font-size="11" text-anchor="middle" fill="#fff">6</text>

    <rect x="16" y="308" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="335">Tipo de contrato</text>
    <circle cx="775" cy="308" r="11" fill="#1f2d3d"/><text x="775" y="312" font-size="11" text-anchor="middle" fill="#fff">7</text>

    <rect x="16" y="360" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="387">Datos del trabajador</text>
    <circle cx="775" cy="360" r="11" fill="#1f2d3d"/><text x="775" y="364" font-size="11" text-anchor="middle" fill="#fff">8</text>

    <rect x="16" y="412" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="439">Fecha de ingreso</text>
    <circle cx="775" cy="412" r="11" fill="#1f2d3d"/><text x="775" y="416" font-size="11" text-anchor="middle" fill="#fff">9</text>

    <rect x="16" y="464" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="491">Portafolio y exclusividad</text>
    <circle cx="775" cy="464" r="11" fill="#1f2d3d"/><text x="775" y="468" font-size="10" text-anchor="middle" fill="#fff">10</text>

    <rect x="16" y="516" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="543">Salario</text>
    <circle cx="775" cy="516" r="11" fill="#1f2d3d"/><text x="775" y="520" font-size="10" text-anchor="middle" fill="#fff">11</text>

    <rect x="16" y="568" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="595">Comisiones</text>
    <circle cx="775" cy="568" r="11" fill="#1f2d3d"/><text x="775" y="572" font-size="10" text-anchor="middle" fill="#fff">12</text>

    <rect x="16" y="620" width="768" height="44" rx="6" fill="#EFE7D2" stroke="#d8cca4"/>
    <text x="32" y="647">Teletrabajo</text>
    <circle cx="775" cy="620" r="11" fill="#1f2d3d"/><text x="775" y="624" font-size="10" text-anchor="middle" fill="#fff">13</text>
  </g>
</svg>
