  <circle cx="662" cy="110" r="9" fill="#1f2d3d"/><text x="662" y="114" font-size="9" text-anchor="middle" fill="#fff">2</text>

  <rect x="32" y="156" width="300" height="34" rx="17" fill="#3f4a2b"/><text x="182" y="177" font-size="10" text-anchor="middle" fill="#fff">📄 Subir PDF(s) de colillas</text>
  <circle cx="42" cy="150" r="9" fill="#1f2d3d"/><text x="42" y="154" font-size="9" text-anchor="middle" fill="#fff">3</text>

