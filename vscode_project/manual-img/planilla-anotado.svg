  <rect x="242" y="198" width="180" height="30" rx="15" fill="#fff" stroke="#D9A54A"/><text x="332" y="217" font-size="9.5" text-anchor="middle" fill="#a8781f">⚠️ Ver faltantes</text>
  <circle cx="42" cy="192" r="9" fill="#1f2d3d"/><text x="42" y="196" font-size="9" text-anchor="middle" fill="#fff">4</text>
  <circle cx="252" cy="192" r="9" fill="#1f2d3d"/><text x="252" y="196" font-size="9" text-anchor="middle" fill="#fff">5</text>

