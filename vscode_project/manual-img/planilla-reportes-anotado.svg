<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="700" height="560" fill="#F5F1E6"/>

  <rect x="16" y="16" width="668" height="100" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="38" font-size="12" font-weight="bold">📊 Reporte de incidencias por fechas</text>
  <text x="32" y="56" font-size="9.5" fill="#777">Descarga un Excel con los ingresos y salidas de personal entre dos fechas.</text>
  <rect x="32" y="66" width="140" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="42" y="83" font-size="9" fill="#888">dd/mm/aaaa</text>
  <rect x="182" y="66" width="140" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="192" y="83" font-size="9" fill="#888">dd/mm/aaaa</text>
  <rect x="332" y="64" width="220" height="30" rx="15" fill="#3f4a2b"/><text x="442" y="83" font-size="9.5" text-anchor="middle" fill="#fff">⬇ Generar y descargar Excel</text>
  <circle cx="662" cy="10" r="9" fill="#1f2d3d"/><text x="662" y="14" font-size="9" text-anchor="middle" fill="#fff">1</text>

  <rect x="16" y="128" width="668" height="180" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="150" font-size="12" font-weight="bold">🗓️ Reporte de horarios para pago de planilla</text>
  <text x="32" y="168" font-size="9.5" fill="#777">Por empleado: días laborados, incapacidad/PSG/cita/ausencia, horas extra y días libres/vacaciones.</text>
  <rect x="32" y="178" width="140" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="42" y="195" font-size="9">setiembre 2026</text>
  <rect x="182" y="178" width="170" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="192" y="195" font-size="9">2ª (día 16 al fin de mes)</text>
  <rect x="362" y="178" width="140" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="372" y="195" font-size="8.5" fill="#888">Datos desde (opc.)</text>
  <rect x="512" y="178" width="140" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="522" y="195" font-size="8.5" fill="#888">Datos hasta (opc.)</text>
  <rect x="32" y="214" width="220" height="30" rx="15" fill="#3f4a2b"/><text x="142" y="233" font-size="9.5" text-anchor="middle" fill="#fff">⬇ Generar y descargar Excel</text>
  <text x="32" y="266" font-size="8.5" fill="#888">Si el archivo real de marcación no calza con el calendario de la quincena, poné aquí el rango real —</text>
  <text x="32" y="280" font-size="8.5" fill="#888">vacío usa el período completo, igual que hoy.</text>
  <circle cx="662" cy="122" r="9" fill="#1f2d3d"/><text x="662" y="126" font-size="9" text-anchor="middle" fill="#fff">2</text>

  <rect x="16" y="322" width="668" height="200" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="344" font-size="12" font-weight="bold">📄 Generar colillas de pago (nuevo)</text>
  <text x="32" y="362" font-size="9.5" fill="#777">Arma la colilla acá mismo (Ordinario + Feriado doble + Horas extra − CCSS 10.83% = Neto), en vez</text>
  <text x="32" y="376" font-size="9.5" fill="#777">de subir el PDF de un proveedor externo — "Subir/actualizar colillas" sigue funcionando igual mientras tanto.</text>
  <rect x="32" y="386" width="140" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="42" y="403" font-size="9">setiembre 2026</text>
  <rect x="182" y="386" width="170" height="26" rx="4" fill="#fbfaf6" stroke="#ddd"/><text x="192" y="403" font-size="9">2ª (día 16 al fin de mes)</text>
  <rect x="32" y="422" width="200" height="30" rx="15" fill="#3f4a2b"/><text x="132" y="441" font-size="9.5" text-anchor="middle" fill="#fff">🧮 Calcular vista previa</text>
  <text x="32" y="474" font-size="8.5" fill="#888">No incluye ninguna deducción aparte de CCSS — esas se agregan a mano por persona antes de generar.</text>
  <circle cx="662" cy="316" r="9" fill="#1f2d3d"/><text x="662" y="320" font-size="9" text-anchor="middle" fill="#fff">3</text>
</svg>
