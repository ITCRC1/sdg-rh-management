  <rect x="16" y="472" width="378" height="80" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="494" font-size="12" font-weight="bold" fill="#333">Solicitudes pendientes</text>
  <text x="32" y="514" font-size="10" fill="#555">Pendiente — depende de los módulos de Vacaciones y Días libres.</text>
  <circle cx="26" cy="480" r="11" fill="#1f2d3d"/><text x="26" y="484" font-size="11" text-anchor="middle" fill="#fff">12</text>

  <rect x="406" y="472" width="378" height="80" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="422" y="494" font-size="12" font-weight="bold" fill="#333">Próximos eventos</text>
  <text x="422" y="514" font-size="10" fill="#555">Pendiente — depende del calendario de Vacaciones/Incapacidades.</text>
  <circle cx="416" cy="480" r="11" fill="#1f2d3d"/><text x="416" y="484" font-size="11" text-anchor="middle" fill="#fff">13</text>

  <!-- Botón -->
  <rect x="16" y="574" width="230" height="40" rx="20" fill="#3f4a2b"/>
  <text x="131" y="599" font-size="12" font-weight="bold" text-anchor="middle" fill="#fff">Crear contrato nuevo</text>
  <circle cx="256" cy="582" r="11" fill="#1f2d3d"/><text x="256" y="586" font-size="11" text-anchor="middle" fill="#fff">14</text>
  <line x1="245" y1="582" x2="230" y2="588" stroke="#B3261E" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
