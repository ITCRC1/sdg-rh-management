    <text x="107" y="255" font-size="20" font-weight="bold" text-anchor="middle">82</text>
    <text x="107" y="275" text-anchor="middle" fill="#666">Empleados activos</text>
    <circle cx="26" cy="222" r="11" fill="#1f2d3d"/><text x="26" y="226" font-size="11" text-anchor="middle" fill="#fff">6</text>

    <rect x="206" y="214" width="182" height="80" rx="8" fill="#fff" stroke="#e2ddd0"/>
    <text x="297" y="255" font-size="20" font-weight="bold" text-anchor="middle">10</text>
    <text x="297" y="275" text-anchor="middle" fill="#666">Contratos guardados</text>
    <circle cx="216" cy="222" r="11" fill="#1f2d3d"/><text x="216" y="226" font-size="11" text-anchor="middle" fill="#fff">7</text>

    <rect x="396" y="214" width="182" height="80" rx="8" fill="#fff" stroke="#e2ddd0"/>
    <text x="487" y="255" font-size="20" font-weight="bold" text-anchor="middle">2</text>
    <text x="487" y="275" text-anchor="middle" fill="#666">Colillas pendientes</text>
    <circle cx="406" cy="222" r="11" fill="#1f2d3d"/><text x="406" y="226" font-size="11" text-anchor="middle" fill="#fff">8</text>

    <rect x="586" y="214" width="198" height="80" rx="8" fill="#fff" stroke="#e2ddd0"/>
    <text x="685" y="255" font-size="20" font-weight="bold" text-anchor="middle">8</text>
    <text x="685" y="275" text-anchor="middle" fill="#666">Empleados archivados</text>
    <circle cx="596" cy="222" r="11" fill="#1f2d3d"/><text x="596" y="226" font-size="11" text-anchor="middle" fill="#fff">9</text>
  </g>

  <!-- Alertas RRHH / Actividad reciente -->
  <rect x="16" y="310" width="378" height="150" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="32" y="332" font-size="12" font-weight="bold" fill="#a8781f">Alertas de RR.HH.</text>
  <text x="32" y="354" font-size="10" fill="#555">• 82 empleado(s) sin firmar el Handbook</text>
  <text x="32" y="374" font-size="10" fill="#555">• 2 empleado(s) sin colilla del período actual</text>
  <text x="32" y="394" font-size="10" fill="#555">• 109 registro(s) de horas extra por aprobar</text>
  <circle cx="26" cy="318" r="11" fill="#1f2d3d"/><text x="26" y="322" font-size="11" text-anchor="middle" fill="#fff">10</text>

  <rect x="406" y="310" width="378" height="150" rx="8" fill="#fff" stroke="#e2ddd0"/>
  <text x="422" y="332" font-size="12" font-weight="bold" fill="#333">Actividad reciente</text>
  <text x="422" y="354" font-size="10" fill="#555">Andrey Flores actualizó un registro de horas extra — hace 14 min</text>
  <text x="422" y="372" font-size="10" fill="#555">Andrey Flores creó un documento — hace 14 min</text>
  <text x="422" y="390" font-size="10" fill="#555">Andrey Flores creó un registro de horas extra — hace 27 min</text>
  <circle cx="416" cy="318" r="11" fill="#1f2d3d"/><text x="416" y="322" font-size="11" text-anchor="middle" fill="#fff">11</text>

