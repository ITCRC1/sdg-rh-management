<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="660" fill="#F5F1E6"/>

  <!-- Barra superior -->
  <rect x="0" y="40" width="800" height="44" fill="#FFFFFF" stroke="#DDD"/>
  <text x="16" y="66" font-size="13" fill="#333">Trabajando en: SCP Corcovado Wilderness Lodge</text>
  <circle cx="635" cy="62" r="10" fill="#FFFFFF" stroke="#999"/>
  <text x="635" y="66" font-size="10" text-anchor="middle" fill="#B3261E">2</text>
  <circle cx="700" cy="62" r="10" fill="#3f4a2b"/>
  <text x="700" y="66" font-size="10" text-anchor="middle" fill="#fff">A</text>
  <text x="716" y="59" font-size="10" fill="#333">Andrey Flores</text>
  <text x="716" y="71" font-size="9" fill="#888">Master</text>

  <!-- Callouts 1,2,3 -->
  <line x1="175" y1="20" x2="175" y2="38" stroke="#B3261E" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="175" cy="14" r="11" fill="#1f2d3d"/><text x="175" y="18" font-size="11" text-anchor="middle" fill="#fff">1</text>
  <line x1="635" y1="20" x2="635" y2="50" stroke="#B3261E" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="635" cy="14" r="11" fill="#1f2d3d"/><text x="635" y="18" font-size="11" text-anchor="middle" fill="#fff">2</text>
  <line x1="716" y1="20" x2="705" y2="52" stroke="#B3261E" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="716" cy="14" r="11" fill="#1f2d3d"/><text x="716" y="18" font-size="11" text-anchor="middle" fill="#fff">3</text>

  <!-- Alerta roja -->
  <rect x="16" y="96" width="768" height="56" rx="8" fill="#FFF5F5" stroke="#B3261E" stroke-width="1.5"/>
  <text x="32" y="118" font-size="13" font-weight="bold" fill="#B3261E">Toca subir las colillas de pago del período 1/9/2026 al 15/9/2026</text>
  <text x="32" y="136" font-size="11" fill="#946" >2 empleado(s) todavía sin colilla archivada de este período. Toca para ver quién falta.</text>
  <circle cx="775" cy="90" r="11" fill="#1f2d3d"/><text x="775" y="94" font-size="11" text-anchor="middle" fill="#fff">4</text>
  <line x1="775" y1="101" x2="770" y2="112" stroke="#B3261E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Saludo -->
  <text x="16" y="182" font-size="18" font-weight="bold" fill="#2b2b2b">Buenos días, Andrey</text>
  <text x="16" y="200" font-size="11" fill="#888">Centro de control de Recursos Humanos — SCP Corcovado Wilderness Lodge</text>
  <circle cx="330" cy="176" r="11" fill="#1f2d3d"/><text x="330" y="180" font-size="11" text-anchor="middle" fill="#fff">5</text>
  <line x1="319" y1="176" x2="270" y2="180" stroke="#B3261E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- KPI cards -->
  <g font-size="11">
